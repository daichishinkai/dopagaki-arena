<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ドパガキアリーナ</title>
    <style>
      html, body { margin: 0; background: #07070f; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: auto; }
      /* 裁定40: タッチ端末を縦に持ったときは横向きを促す */
      #rotate { display: none; position: fixed; inset: 0; background: #07070f; color: #e5e7eb; z-index: 10;
        align-items: center; justify-content: center; text-align: center; font-family: sans-serif; font-size: 22px; line-height: 1.8; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">端末を横向きにしてください<br /><span style="font-size:40px">⟳</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
